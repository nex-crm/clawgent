name: Upgrade OpenClaw Instances

on:
  schedule:
    # Weekly: Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      version:
        description: "OpenClaw version (e.g. 2026.3.8) or 'latest'"
        required: true
        default: "latest"
      dry_run:
        description: "Dry run — list containers but don't upgrade"
        required: false
        type: boolean
        default: false

concurrency:
  group: openclaw-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade Running Instances
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read

    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenClaw version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || 'latest' }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            echo "Resolving latest OpenClaw tag from ghcr.io..."
            TAGS=$(curl -sS "https://ghcr.io/v2/openclaw/openclaw/tags/list" \
              | jq -r '.tags[]' 2>/dev/null \
              | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1)
            if [ -z "$TAGS" ]; then
              echo "::error::Could not resolve latest tag from ghcr.io"
              exit 1
            fi
            echo "Resolved latest version: ${TAGS}"
            echo "version=${TAGS}" >> "$GITHUB_OUTPUT"
          else
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version format: $INPUT_VERSION (expected YYYY.M.D, e.g. 2026.3.8)"
              exit 1
            fi
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSM helper
        run: |
          cat > /tmp/ssm_run.sh << 'HELPER'
          ssm_run() {
            local desc="$1" timeout="$2" script="$3"
            echo "=== $desc ==="
            local params
            params=$(jq -n --arg s "$script" \
              '{"commands": (["#!/bin/bash"] + ($s | split("\n") | map(select(length > 0))))}')
            local cmd_id
            cmd_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "$desc" \
              --timeout-seconds "$timeout" \
              --parameters "$params" \
              --output text \
              --query 'Command.CommandId') || { echo "Failed to send SSM command" >&2; return 1; }
            if [ -z "$cmd_id" ]; then
              echo "No command ID returned from SSM" >&2; return 1
            fi
            echo "SSM command: $cmd_id"
            local elapsed=0
            while [ "$elapsed" -lt "$timeout" ]; do
              local inv
              inv=$(aws ssm get-command-invocation \
                --command-id "$cmd_id" \
                --instance-id "$INSTANCE_ID" 2>/dev/null || true)
              if [ -z "$inv" ]; then
                sleep 5; elapsed=$((elapsed + 5)); continue
              fi
              local status
              status=$(printf '%s' "$inv" | jq -r '.StatusDetails')
              case "$status" in
                Success)
                  printf '%s' "$inv" | jq -r '.StandardOutputContent'
                  return 0
                  ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  printf '%s' "$inv" | jq -r '.StandardOutputContent'
                  printf '%s' "$inv" | jq -r '.StandardErrorContent' >&2
                  echo "Command failed: $status" >&2
                  return 1
                  ;;
                *)
                  echo "[${elapsed}s] $status..."
                  sleep 5; elapsed=$((elapsed + 5))
                  ;;
              esac
            done
            echo "Timed out after ${timeout}s" >&2
            return 1
          }
          HELPER

      - name: Pull and tag new OpenClaw image
        env:
          OPENCLAW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Pull OpenClaw ${OPENCLAW_VERSION}" 300 "
          set -euo pipefail
          echo \"Pulling OpenClaw ${OPENCLAW_VERSION} from ghcr.io...\"
          docker pull \"ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION}\"
          docker tag \"ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION}\" clawgent-openclaw
          echo \"OpenClaw image ready:\"
          docker images clawgent-openclaw
          echo \"\"
          echo \"Old images:\"
          docker images --filter \"reference=ghcr.io/openclaw/openclaw\" --format \"{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}\""

      - name: List running instances
        run: |
          source /tmp/ssm_run.sh
          ssm_run "List running instances" 30 '
          set -euo pipefail
          echo "Running clawgent containers:"
          docker ps --filter "name=clawgent-" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}" || echo "No containers found"
          echo ""
          echo "Container count: $(docker ps --filter "name=clawgent-" -q | wc -l)"'

      - name: Build Nex plugin
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Cloning nex-as-a-skill and building plugin..."
          git clone --depth 1 https://github.com/nex-crm/nex-as-a-skill.git /tmp/nex-as-a-skill
          cd /tmp/nex-as-a-skill/openclaw-plugin
          npm ci
          npm run build
          echo "Plugin built successfully"
          ls -la dist/

      - name: Upload Nex plugin to S3
        if: ${{ !inputs.dry_run }}
        run: |
          aws s3 sync /tmp/nex-as-a-skill/openclaw-plugin/dist/ \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/dist/ --delete
          aws s3 cp /tmp/nex-as-a-skill/openclaw-plugin/package.json \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/package.json
          aws s3 cp /tmp/nex-as-a-skill/openclaw-plugin/openclaw.plugin.json \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/openclaw.plugin.json
          echo "Plugin uploaded to S3"

      - name: Sync Nex plugin to server
        if: ${{ !inputs.dry_run }}
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Sync Nex plugin from S3" 60 '
          set -euo pipefail
          mkdir -p /opt/clawgent/app/plugins/nex/dist
          aws s3 sync s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/ /opt/clawgent/app/plugins/nex/
          chown -R ubuntu:ubuntu /opt/clawgent/app/plugins/nex
          echo "Plugin synced to server"
          ls -la /opt/clawgent/app/plugins/nex/dist/'

      - name: Upgrade all running instances
        if: ${{ !inputs.dry_run }}
        env:
          OPENCLAW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Upgrade all instances" 900 '
          set -euo pipefail
          LOCAL_TAG="clawgent-openclaw"
          CONTAINERS=$(docker ps --filter "name=clawgent-" --format "{{.Names}}" | grep -v "^$" || true)
          if [ -z "$CONTAINERS" ]; then
            echo "No running clawgent containers found. Done."
            exit 0
          fi
          CONTAINER_COUNT=$(echo "$CONTAINERS" | wc -l)
          echo "Upgrading ${CONTAINER_COUNT} container(s)..."
          UPGRADED=0
          FAILED=0
          for CONTAINER in $CONTAINERS; do
            echo ""
            echo "=== Upgrading: ${CONTAINER} ==="
            PORT_MAPPING=$(docker inspect "$CONTAINER" --format "{{range \$p, \$conf := .HostConfig.PortBindings}}{{range \$conf}}{{.HostPort}}{{end}}{{end}}" 2>/dev/null || echo "")
            VOLUME_MOUNTS=$(docker inspect "$CONTAINER" --format "{{range .Mounts}}{{if eq .Type \"volume\"}}--volume {{.Name}}:{{.Destination}} {{end}}{{end}}" 2>/dev/null || echo "")
            ENV_VARS=$(docker inspect "$CONTAINER" --format "{{range .Config.Env}}-e {{.}} {{end}}" 2>/dev/null || echo "")
            MEMORY=$(docker inspect "$CONTAINER" --format "{{.HostConfig.Memory}}" 2>/dev/null || echo "0")
            MEMORY_SWAP=$(docker inspect "$CONTAINER" --format "{{.HostConfig.MemorySwap}}" 2>/dev/null || echo "0")
            PIDS_LIMIT=$(docker inspect "$CONTAINER" --format "{{.HostConfig.PidsLimit}}" 2>/dev/null || echo "0")
            if [ -z "$PORT_MAPPING" ]; then
              echo "WARNING: Could not extract port mapping for ${CONTAINER}, skipping"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Port: ${PORT_MAPPING}:18789"
            echo "Stopping ${CONTAINER}..."
            docker stop "$CONTAINER" --time 30 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true
            RESOURCE_FLAGS=""
            if [ "$MEMORY" != "0" ] && [ -n "$MEMORY" ]; then
              RESOURCE_FLAGS="${RESOURCE_FLAGS} --memory=${MEMORY}"
            fi
            if [ "$MEMORY_SWAP" != "0" ] && [ -n "$MEMORY_SWAP" ]; then
              RESOURCE_FLAGS="${RESOURCE_FLAGS} --memory-swap=${MEMORY_SWAP}"
            fi
            if [ "$PIDS_LIMIT" != "0" ] && [ "$PIDS_LIMIT" != "-1" ] && [ -n "$PIDS_LIMIT" ]; then
              RESOURCE_FLAGS="${RESOURCE_FLAGS} --pids-limit=${PIDS_LIMIT}"
            fi
            echo "Creating ${CONTAINER} with new image..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "${PORT_MAPPING}:18789" \
              ${VOLUME_MOUNTS} \
              ${ENV_VARS} \
              ${RESOURCE_FLAGS} \
              "${LOCAL_TAG}"
            docker exec -u root "$CONTAINER" chown -R node:node /home/node/.openclaw 2>/dev/null || true
            echo "Running openclaw doctor --fix..."
            docker exec "$CONTAINER" node /app/openclaw.mjs doctor --fix 2>/dev/null || echo "WARNING: doctor --fix failed (non-fatal)"
            echo "Waiting for health..."
            HEALTHY=false
            for i in $(seq 1 15); do
              if docker exec "$CONTAINER" node /app/openclaw.mjs gateway status 2>/dev/null | grep -qi "running\|ok\|ready"; then
                HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" = true ]; then
              echo "${CONTAINER} is healthy"
              UPGRADED=$((UPGRADED + 1))
            else
              echo "WARNING: ${CONTAINER} may not be fully healthy yet"
              UPGRADED=$((UPGRADED + 1))
            fi

            # --- Config injection (openclaw.json) ---
            echo "Injecting openclaw.json config..."
            EXISTING_CONFIG=$(docker exec "$CONTAINER" cat /home/node/.openclaw/openclaw.json 2>/dev/null || echo "{}")
            PATCHED_CONFIG=$(printf "%s" "$EXISTING_CONFIG" | jq '
              .gateway.trustedProxies = ["172.16.0.0/12", "127.0.0.1"] |
              .gateway.controlUi.allowedOrigins = ["https://clawgent.ai", "http://localhost:3001"] |
              .tools.profile = (if .tools.profile then .tools.profile else "default" end) |
              .commands.native = (.commands.native // "auto") |
              .commands.nativeSkills = (.commands.nativeSkills // "auto")
            ')
            TMP_CFG="/tmp/openclaw_${CONTAINER}.json"
            printf "%s" "$PATCHED_CONFIG" > "$TMP_CFG"
            docker cp "$TMP_CFG" "${CONTAINER}:/home/node/.openclaw/openclaw.json"
            docker exec -u root "$CONTAINER" chown node:node /home/node/.openclaw/openclaw.json
            rm -f "$TMP_CFG"
            docker exec "$CONTAINER" node /app/openclaw.mjs gateway reload 2>/dev/null || echo "WARNING: gateway reload failed (non-fatal)"
            echo "Config injected"

            # --- Agent re-registration ---
            echo "Checking agent registration..."
            AGENT_DIRS=$(docker exec "$CONTAINER" ls /home/node/.openclaw/agents/ 2>/dev/null || echo "")
            if [ -n "$AGENT_DIRS" ]; then
              REGISTERED=$(docker exec "$CONTAINER" node /app/openclaw.mjs agents list 2>/dev/null || echo "")
              for AGENT_DIR in $AGENT_DIRS; do
                if ! echo "$REGISTERED" | grep -qi "$AGENT_DIR"; then
                  echo "Registering agent: ${AGENT_DIR}"
                  docker exec "$CONTAINER" node /app/openclaw.mjs agents add \
                    --dir "/home/node/.openclaw/agents/${AGENT_DIR}" 2>/dev/null || \
                    echo "WARNING: Failed to register ${AGENT_DIR}"
                  # Restore identity if IDENTITY.md exists
                  IDENTITY_FILE="/home/node/.openclaw/agents/${AGENT_DIR}/IDENTITY.md"
                  if docker exec "$CONTAINER" test -f "$IDENTITY_FILE" 2>/dev/null; then
                    IDENTITY_NAME=$(docker exec "$CONTAINER" grep -oP "^identityName:\s*\K.+" "$IDENTITY_FILE" 2>/dev/null || echo "")
                    IDENTITY_EMOJI=$(docker exec "$CONTAINER" grep -oP "^identityEmoji:\s*\K.+" "$IDENTITY_FILE" 2>/dev/null || echo "")
                    if [ -n "$IDENTITY_NAME" ]; then
                      echo "  Restoring identity: ${IDENTITY_EMOJI} ${IDENTITY_NAME}"
                      docker exec "$CONTAINER" node /app/openclaw.mjs agents update "$AGENT_DIR" \
                        --identityName "$IDENTITY_NAME" \
                        ${IDENTITY_EMOJI:+--identityEmoji "$IDENTITY_EMOJI"} \
                        2>/dev/null || echo "  WARNING: identity restore failed"
                    fi
                  fi
                else
                  echo "Agent ${AGENT_DIR} already registered"
                fi
              done
            else
              echo "No agent directories found"
            fi

            # --- Nex plugin injection ---
            PLUGIN_SRC="/opt/clawgent/app/plugins/nex"
            if [ -d "$PLUGIN_SRC" ]; then
              echo "Injecting nex plugin into ${CONTAINER}..."
              docker exec -u root "$CONTAINER" mkdir -p /plugins/nex 2>/dev/null || true
              docker cp "${PLUGIN_SRC}/." "${CONTAINER}:/plugins/nex/" 2>/dev/null || true
              docker exec -u root "$CONTAINER" chown -R node:node /plugins/nex 2>/dev/null || true
              echo "Plugin injected"
            fi
          done
          echo ""
          echo "=============================="
          echo "Upgrade complete"
          echo "Upgraded: ${UPGRADED}/${CONTAINER_COUNT}"
          if [ "$FAILED" -gt 0 ]; then
            echo "Failed: ${FAILED}/${CONTAINER_COUNT}"
          fi
          echo "=============================="
          echo ""
          echo "Final container status:"
          docker ps --filter "name=clawgent-" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"'

      - name: Verify OpenClaw version
        if: ${{ !inputs.dry_run }}
        env:
          OPENCLAW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Verify OpenClaw version" 60 "
          set -euo pipefail
          echo \"Expected version: ${OPENCLAW_VERSION}\"
          CONTAINERS=\$(docker ps --filter \"name=clawgent-\" --format \"{{.Names}}\" | grep -v \"^\$\" || true)
          if [ -z \"\$CONTAINERS\" ]; then
            echo \"No running containers to verify\"
            exit 0
          fi
          ALL_OK=true
          for CONTAINER in \$CONTAINERS; do
            VERSION=\$(docker exec \"\$CONTAINER\" node /app/openclaw.mjs --version 2>/dev/null || echo \"unknown\")
            echo \"\${CONTAINER}: \${VERSION}\"
            if ! echo \"\$VERSION\" | grep -q \"${OPENCLAW_VERSION}\"; then
              echo \"  WARNING: version mismatch\"
              ALL_OK=false
            fi
          done
          if [ \"\$ALL_OK\" = true ]; then
            echo \"\"
            echo \"All containers running expected version\"
          else
            echo \"\"
            echo \"WARNING: Some containers have version mismatch\"
          fi"

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN complete — no containers were modified."
          echo "Review the 'List running instances' step output above."
          echo "Re-run this workflow with dry_run=false to perform the upgrade."
