name: Update Nex Plugin

on:
  schedule:
    # Weekly: Wednesdays at 04:00 UTC (offset from OpenClaw upgrade on Sundays)
    - cron: "0 4 * * 3"
  workflow_dispatch:

concurrency:
  group: nex-plugin-update
  cancel-in-progress: false

jobs:
  update-plugin:
    name: Build & Deploy Nex Plugin
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Clone nex-as-a-skill
        run: |
          git clone --depth 1 https://github.com/nex-crm/nex-as-a-skill.git /tmp/nex-as-a-skill

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build plugin
        run: |
          cd /tmp/nex-as-a-skill/openclaw-plugin
          npm ci
          npm run build
          echo "Plugin built successfully"
          ls -la dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload plugin to S3
        run: |
          aws s3 sync /tmp/nex-as-a-skill/openclaw-plugin/dist/ \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/dist/ --delete
          aws s3 cp /tmp/nex-as-a-skill/openclaw-plugin/package.json \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/package.json
          aws s3 cp /tmp/nex-as-a-skill/openclaw-plugin/openclaw.plugin.json \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/openclaw.plugin.json
          echo "Plugin uploaded to S3"

      - name: Setup SSM helper
        run: |
          cat > /tmp/ssm_run.sh << 'HELPER'
          ssm_run() {
            local desc="$1" timeout="$2" script="$3"
            echo "=== $desc ==="
            local params
            params=$(jq -n --arg s "$script" \
              '{"commands": (["#!/bin/bash"] + ($s | split("\n") | map(select(length > 0))))}')
            local cmd_id
            cmd_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "$desc" \
              --timeout-seconds "$timeout" \
              --parameters "$params" \
              --output text \
              --query 'Command.CommandId') || { echo "Failed to send SSM command" >&2; return 1; }
            if [ -z "$cmd_id" ]; then
              echo "No command ID returned from SSM" >&2; return 1
            fi
            echo "SSM command: $cmd_id"
            local elapsed=0
            while [ "$elapsed" -lt "$timeout" ]; do
              local inv
              inv=$(aws ssm get-command-invocation \
                --command-id "$cmd_id" \
                --instance-id "$INSTANCE_ID" 2>/dev/null || true)
              if [ -z "$inv" ]; then
                sleep 5; elapsed=$((elapsed + 5)); continue
              fi
              local status
              status=$(printf '%s' "$inv" | jq -r '.StatusDetails')
              case "$status" in
                Success)
                  printf '%s' "$inv" | jq -r '.StandardOutputContent'
                  return 0
                  ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  printf '%s' "$inv" | jq -r '.StandardOutputContent'
                  printf '%s' "$inv" | jq -r '.StandardErrorContent' >&2
                  echo "Command failed: $status" >&2
                  return 1
                  ;;
                *)
                  echo "[${elapsed}s] $status..."
                  sleep 5; elapsed=$((elapsed + 5))
                  ;;
              esac
            done
            echo "Timed out after ${timeout}s" >&2
            return 1
          }
          HELPER

      - name: Sync plugin to server
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Sync Nex plugin from S3" 60 '
          set -euo pipefail
          mkdir -p /opt/clawgent/app/plugins/nex/dist
          aws s3 sync s3://${{ secrets.S3_DEPLOY_BUCKET }}/plugins/nex/ /opt/clawgent/app/plugins/nex/
          chown -R ubuntu:ubuntu /opt/clawgent/app/plugins/nex
          echo "Plugin synced to server"
          ls -la /opt/clawgent/app/plugins/nex/dist/'

      - name: Inject plugin into running containers
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Inject plugin into containers" 120 '
          set -euo pipefail
          PLUGIN_SRC="/opt/clawgent/app/plugins/nex"
          CONTAINERS=$(docker ps --filter "name=clawgent-" --format "{{.Names}}" | grep -v "^$" || true)
          if [ -z "$CONTAINERS" ]; then
            echo "No running clawgent containers. Plugin synced to disk only."
            exit 0
          fi
          INJECTED=0
          for CONTAINER in $CONTAINERS; do
            echo "Injecting into ${CONTAINER}..."
            docker exec -u root "$CONTAINER" mkdir -p /plugins/nex 2>/dev/null || true
            docker cp "${PLUGIN_SRC}/." "${CONTAINER}:/plugins/nex/"
            docker exec -u root "$CONTAINER" chown -R node:node /plugins/nex
            INJECTED=$((INJECTED + 1))
          done
          echo ""
          echo "Plugin injected into ${INJECTED} container(s)"'

      - name: Verify plugin in containers
        run: |
          source /tmp/ssm_run.sh
          ssm_run "Verify plugin files" 60 '
          set -euo pipefail
          CONTAINERS=$(docker ps --filter "name=clawgent-" --format "{{.Names}}" | grep -v "^$" || true)
          if [ -z "$CONTAINERS" ]; then
            echo "No running containers to verify"
            exit 0
          fi
          ALL_OK=true
          for CONTAINER in $CONTAINERS; do
            echo "=== ${CONTAINER} ==="
            if docker exec "$CONTAINER" test -f /plugins/nex/dist/index.js 2>/dev/null; then
              echo "  Plugin index.js: present"
              docker exec "$CONTAINER" ls -la /plugins/nex/dist/index.js 2>/dev/null
            else
              echo "  WARNING: Plugin index.js NOT found"
              ALL_OK=false
            fi
            if docker exec "$CONTAINER" test -f /plugins/nex/openclaw.plugin.json 2>/dev/null; then
              echo "  Plugin manifest: present"
            else
              echo "  WARNING: Plugin manifest NOT found"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" = true ]; then
            echo ""
            echo "All containers have plugin files"
          else
            echo ""
            echo "WARNING: Some containers are missing plugin files"
            exit 1
          fi'
